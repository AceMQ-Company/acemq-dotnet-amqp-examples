# A broker for the examples. Plain AMQP on 5672, which is every example here.
#
# There is no TLS example in this repository yet, so there is no second broker
# either. The Java, Python, Go and Ruby repositories each have one, and it is a
# `broker-tls` service on a compose profile reading certificates the library
# wrote — `AceMq.Amqp.DevCerts` writes them, so the piece that is missing is the
# example, not the means. Adding it adds a service beside this one rather than
# changing it.
services:
  broker:
    image: rabbitmq:4-alpine
    environment:
      # RabbitMQ writes its Erlang cookie under HOME, and the default in this
      # image is not writable on every Docker setup. Pointing it at /tmp is the
      # difference between a broker that starts and one that dies with an
      # "eacces" nobody can interpret.
      HOME: /tmp
    ports:
      - "5672:5672"
      - "15672:15672"
