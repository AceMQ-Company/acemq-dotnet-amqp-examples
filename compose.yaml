# Three brokers, and two of them exist because one example each cannot share.
#
#   broker         plain AMQP on 5672, which is every example but two
#   broker-health  advanced/03, which raises a memory alarm on whatever it runs
#                  against -- and an alarm is raised on the node, not on the
#                  connection, so it would block every other example too
#   broker-tls     advanced/04, which needs a TLS listener holding certificates
#                  generated on this machine, so it cannot start until they exist
#
#   docker compose up -d                  # broker and broker-health
#   docker compose --profile tls up -d    # and broker-tls, once certs/ exists
services:
  broker:
    image: rabbitmq:4-alpine
    environment:
      # RabbitMQ writes its Erlang cookie under HOME, and the default in this
      # image is not writable on every Docker setup. Pointing it at /tmp is the
      # difference between a broker that starts and one that dies with an
      # "eacces" nobody can interpret.
      HOME: /tmp
    ports:
      - "5672:5672"
      - "15672:15672"

  # A broker nobody else touches, for advanced/03. That example drops the memory
  # high watermark with rabbitmqctl until the broker really blocks, and it puts
  # the watermark back afterwards -- but "puts it back afterwards" is not a
  # guarantee worth resting thirty-six other examples on, and the window in
  # between would block them regardless.
  #
  # Not behind a profile: it needs nothing generated first, and an example that
  # fails until you read the compose file is an example nobody runs.
  broker-health:
    image: rabbitmq:4-alpine
    # Pinned, because advanced/03 reaches the broker's own control tool with
    # `docker exec <name> rabbitmqctl` -- nothing in AMQP can raise a memory
    # alarm. Compose would otherwise name it after this directory.
    container_name: acemq-examples-broker-health
    environment:
      HOME: /tmp
    ports:
      - "5673:5672"

  # The TLS listener advanced/04 needs, holding certificates the library's own
  # generator wrote. Behind a profile because it cannot start until they exist:
  #
  #   curl -O https://acemq.org/nuget/v3/flatcontainer/acemq.amqp.devcerts/0.7.2/acemq.amqp.devcerts.0.7.2.nupkg
  #   dotnet tool install --global AceMq.Amqp.DevCerts --version 0.7.2 --source .
  #   acemq-certs --out certs --broker localhost
  #   chmod 644 certs/server.key
  #   docker compose --profile tls up -d
  #
  # The nupkg is downloaded first because `dotnet tool install` cannot read the
  # AceMQ feed directly, and it is `--source` rather than `--add-source` because
  # that one REPLACES the configured sources where the other adds to them --
  # which would put this repository's own nuget.config back in scope and fail
  # the same way. Both are explained in the example's README.
  #
  # The chmod is because the generator writes keys 0600, which is right for a
  # key and wrong for a container running as another user; RabbitMQ reports an
  # unreadable key as a listener that failed to start, which is a long way from
  # what it is.
  broker-tls:
    image: rabbitmq:4-alpine
    profiles: [tls]
    environment:
      HOME: /tmp
    ports:
      - "5671:5671"
    volumes:
      # rabbitmq.conf is written by the same command, and points at /certs.
      - ./certs:/certs:ro
      - ./certs/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
