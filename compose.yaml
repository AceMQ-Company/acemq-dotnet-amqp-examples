# Two brokers, and the second exists because one example cannot share.
#
#   broker         plain AMQP on 5672, which is every example but one
#   broker-health  advanced/03, which raises a memory alarm on whatever it runs
#                  against -- and an alarm is raised on the node, not on the
#                  connection, so it would block every other example too
#
#   docker compose up -d
services:
  broker:
    image: rabbitmq:4-alpine
    environment:
      # RabbitMQ writes its Erlang cookie under HOME, and the default in this
      # image is not writable on every Docker setup. Pointing it at /tmp is the
      # difference between a broker that starts and one that dies with an
      # "eacces" nobody can interpret.
      HOME: /tmp
    ports:
      - "5672:5672"
      - "15672:15672"

  # A broker nobody else touches, for advanced/03. That example drops the memory
  # high watermark with rabbitmqctl until the broker really blocks, and it puts
  # the watermark back afterwards -- but "puts it back afterwards" is not a
  # guarantee worth resting thirty-six other examples on, and the window in
  # between would block them regardless.
  #
  # Not behind a profile: it needs nothing generated first, and an example that
  # fails until you read the compose file is an example nobody runs.
  broker-health:
    image: rabbitmq:4-alpine
    # Pinned, because advanced/03 reaches the broker's own control tool with
    # `docker exec <name> rabbitmqctl` -- nothing in AMQP can raise a memory
    # alarm. Compose would otherwise name it after this directory.
    container_name: acemq-examples-broker-health
    environment:
      HOME: /tmp
    ports:
      - "5673:5672"
