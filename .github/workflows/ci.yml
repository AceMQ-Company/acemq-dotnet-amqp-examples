# Every example is compiled and run against a real broker on every push.
#
# This is the whole reason the repository can be trusted. Examples rot: the
# library moves on, the example does not, and a newcomer's first experience is a
# build error. Running them here turns that into a red build instead.
#
# Both languages are run, not only C#. The library is one assembly and VB.NET
# calls it the same way, but "should work" and "does work" are different
# claims, and only one of them is worth putting in a README.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The library can change without this repository changing at all, so the
  # examples are also run on a schedule. A weekly failure here is how we find
  # out that a released version broke something the documentation still claims.
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: run the examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # The framework the examples target. Installing it here rather than
          # relying on RollForward means CI runs what the examples say they run
          # on.
          dotnet-version: '8.0.x'

      - name: Build every example
        run: |
          failed=""
          for project in $(find basic intermediate advanced \
                             \( -name '*.csproj' -o -name '*.vbproj' \) | sort); do
            echo "::group::build $project"
            if ! dotnet build "$project" --nologo; then
              failed="$failed $project"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::these examples did not build:$failed"
            exit 1
          fi

      - name: Start a broker
        run: |
          docker run -d --name broker \
            -e HOME=/tmp \
            -p 5672:5672 \
            rabbitmq:4-alpine
          # The broker's own word for it, from this boot. A TCP connect is not
          # enough: Docker publishes the port before RabbitMQ is listening, and
          # a connection then succeeds and is immediately reset.
          started=$(date -u +%Y-%m-%dT%H:%M:%S)
          for i in $(seq 1 60); do
            if docker logs --since "$started" broker 2>&1 | grep -q "Server startup complete"; then
              echo "the broker is up"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the broker never became ready"
          docker logs broker
          exit 1

      - name: Run every example
        env:
          ACEMQ_URL: amqp://guest:guest@localhost:5672/
        run: |
          failed=""
          for project in $(find basic intermediate advanced \
                             \( -name '*.csproj' -o -name '*.vbproj' \) | sort); do
            echo "::group::run $project"
            if ! dotnet run --project "$project" --no-build; then
              failed="$failed $project"
            fi
            echo "::endgroup::"
            # Each example uses queue names of its own. They share one broker
            # here, and two examples declaring the same queue with different
            # settings is a PRECONDITION_FAILED — the library refusing to let a
            # service and its broker disagree. That is correct behaviour and an
            # example design error, and it happened: the encrypting example and
            # the retry example both used "payments".
          done
          if [ -n "$failed" ]; then
            echo "::error::these examples failed:$failed"
            exit 1
          fi

      - name: Check both languages actually ran
        # A find that matched nothing would make the steps above pass having run
        # nothing at all, and a repository that claims VB.NET support should
        # fail when the VB examples stop being run.
        run: |
          cs=$(find basic intermediate advanced -name '*.csproj' | wc -l | tr -d ' ')
          vb=$(find basic intermediate advanced -name '*.vbproj' | wc -l | tr -d ' ')
          echo "$cs C# examples, $vb VB.NET examples"
          if [ "$cs" -lt 2 ] || [ "$vb" -lt 2 ]; then
            echo "::error::expected at least two examples in each language"
            exit 1
          fi

      - name: What the broker said, if anything went wrong
        if: failure()
        run: docker logs broker

  tracks-the-release:
    name: the pin is the newest release
    runs-on: ubuntu-latest
    # A job of its own rather than another step above, deliberately. A stale pin
    # and a broken example are different findings and both are worth having: the
    # examples still build and still run whatever this job concludes, so a red X
    # here reads as "the pinned version is old", never as "we have no idea
    # whether any of this works".
    #
    # It inherits the workflow's triggers, so it runs on the Monday cron as well
    # as on push. That is the run it exists for: a release moves underneath this
    # repository without a commit landing here, and only something on a timer
    # will ever notice.
    steps:
      - uses: actions/checkout@v4

      - name: The pinned library is the newest released one
        # Hard failure rather than a warning, and the argument is worth writing
        # down because the other choice is tempting.
        #
        # This repository exists to prove the current release works. Pinned to an
        # older one it proves something about a version nobody installs any more,
        # and it does that in a green build -- which is worse than no check at
        # all, because a green build is read as an answer. Three of these
        # examples repositories were once found sitting releases behind, all of
        # them green the whole time.
        #
        # The cost of failing hard is real. A library release legitimately lands
        # before the examples are updated, and during that window this job goes
        # red on a repository nobody has broken. But that window is precisely the
        # thing being measured, the fix is a one-line version bump, and a warning
        # buried in a log is what let the drift go unnoticed for releases at a
        # time in the first place.
        #
        # The tags come from the library repository directly rather than from a
        # package feed: git ls-remote needs no token, which matters for a
        # scheduled run, and the tag is what the release was cut from.
        run: |
          pinned=$(sed -n 's/.*<AceMqVersion>\(.*\)<\/AceMqVersion>.*/\1/p' Directory.Build.props | head -1)
          newest=$(git ls-remote --tags https://github.com/AceMQ-Company/acemq-dotnet-amqp \
                     | grep -v '\^{}' | sed 's#.*refs/tags/##' \
                     | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' \
                     | sort -V | tail -1)

          # An empty answer means the listing failed or the tag naming changed,
          # and comparing against nothing would pass silently forever.
          if [ -z "$newest" ]; then
            echo "::error::no release tags found on acemq-dotnet-amqp, so the pin could not be checked"
            exit 1
          fi
          if [ -z "$pinned" ]; then
            echo "::error::no <AceMqVersion> found in Directory.Build.props, so the pin could not be checked"
            exit 1
          fi

          # One property covers AceMq.Amqp, AceMq.Amqp.RabbitMq, AceMq.Amqp.Crypto
          # and AceMq.Amqp.Avro alike, which is why checking it once is enough.
          if [ "$pinned" != "$newest" ]; then
            echo "::error::Directory.Build.props pins AceMq.Amqp $pinned but the newest release is $newest. Edit <AceMqVersion> in Directory.Build.props and set it to $newest, then run the examples against it."
            exit 1
          fi
          echo "pinned $pinned, which is the newest release"
